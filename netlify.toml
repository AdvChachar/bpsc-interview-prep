[build]
  functions = "netlify/functions"
  publish = "src"

[[redirects]]
  from = "/api/mistral"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
